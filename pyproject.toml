[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashcrack-cli"
version = "0.1.1"
description = "Hash identification and lookup tool for CTF and security research"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "shazeus", email = "efeborazan07@gmail.com" }]
keywords = ["hash", "ctf", "security", "md5", "sha256", "cracking", "lookup", "cli", "hashing", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/shazeus/hashcrack"
Repository = "https://github.com/shazeus/hashcrack"
"Bug Tracker" = "https://github.com/shazeus/hashcrack/issues"

[project.scripts]
hashcrack = "hashcrack.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["hashcrack*"]
